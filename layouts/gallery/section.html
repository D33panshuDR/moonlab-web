{{ define "main" }}
<main class="max-w-7xl mx-auto px-6 pt-32 pb-20">
    <h1 class="font-title text-4xl md:text-5xl font-bold mb-8 text-lab-text">{{ .Title }}</h1>
    
    {{ with .Content }}
    <div class="prose prose-slate max-w-none text-lg text-lab-muted mb-12">
        {{ . }}
    </div>
    {{ end }}

    <div class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
        {{ range $index, $item := hugo.Data.gallery.images }}
        <figure class="break-inside-avoid relative group rounded-2xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-lg transition-all duration-300 bg-slate-100 cursor-pointer gallery-item" data-index="{{ $index }}">
            <img src="{{ .image }}" alt="{{ .caption }}" class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out">
            <figcaption class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">
                <p class="text-white font-medium text-lg mb-2">{{ .caption }}</p>
                {{ if .date }}
                <time class="text-white/70 font-mono text-xs">{{ time.Format "Jan 02, 2006" .date }}</time>
                {{ end }}
            </figcaption>
        </figure>
        {{ end }}
    </div>
</main>

<!-- Lightbox Modal Overlay -->
<div id="lightbox" class="fixed inset-0 z-50 bg-black/60 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-300 backdrop-blur-xl">
    <!-- Close Button -->
    <button id="lightbox-close" class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors p-2 focus:outline-none cursor-pointer z-50" aria-label="Close Gallery">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <!-- Navigation Buttons -->
    <button id="lightbox-prev" class="absolute left-6 top-1/2 -translate-y-1/2 text-white/70 hover:text-white transition-colors p-2 focus:outline-none cursor-pointer z-50" aria-label="Previous Image">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
    </button>

    <button id="lightbox-next" class="absolute right-6 top-1/2 -translate-y-1/2 text-white/70 hover:text-white transition-colors p-2 focus:outline-none cursor-pointer z-50" aria-label="Next Image">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
    </button>

    <!-- Modal Content Grid -->
    <div class="max-w-5xl max-h-[85vh] w-full px-6 flex flex-col items-center justify-center select-none">
        <img id="lightbox-img" src="" alt="" class="max-h-[70vh] max-w-full object-contain rounded-xl shadow-2xl transition-all duration-300 scale-95 opacity-0">
        
        <!-- Caption & Date -->
        <div id="lightbox-info" class="text-center mt-6 max-w-2xl px-4 text-white opacity-0 transition-opacity duration-300">
            <p id="lightbox-caption" class="text-lg font-title font-medium leading-relaxed"></p>
            <time id="lightbox-date" class="block text-xs font-mono text-white/60 mt-2"></time>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const galleryItems = document.querySelectorAll('.gallery-item');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxDate = document.getElementById('lightbox-date');
        const lightboxInfo = document.getElementById('lightbox-info');
        const closeBtn = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');

        // Dynamically serialized gallery data
        const images = [
            {{ range hugo.Data.gallery.images }}
            {
                src: {{ .image }},
                caption: {{ .caption }},
                date: {{ if .date }}{{ time.Format "Jan 02, 2006" .date }}{{ else }}""{{ end }}
            },
            {{ end }}
        ];

        let currentIndex = 0;

        const openLightbox = (index) => {
            currentIndex = index;
            updateLightboxContent();
            
            // Show modal
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            document.body.style.overflow = 'hidden';

            // Trigger zoom & fade enter animations
            setTimeout(() => {
                lightboxImg.classList.remove('scale-95', 'opacity-0');
                lightboxInfo.classList.remove('opacity-0');
            }, 50);
        };

        const closeLightbox = () => {
            // Exit animations
            lightboxImg.classList.add('scale-95', 'opacity-0');
            lightboxInfo.classList.add('opacity-0');
            
            setTimeout(() => {
                lightbox.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
            }, 300);
        };

        const updateLightboxContent = () => {
            // Fade out current content
            lightboxImg.classList.add('opacity-0');
            lightboxInfo.classList.add('opacity-0');

            setTimeout(() => {
                const img = images[currentIndex];
                lightboxImg.src = img.src;
                lightboxImg.alt = img.caption;
                lightboxCaption.textContent = img.caption;
                
                if (img.date) {
                    lightboxDate.textContent = img.date;
                    lightboxDate.classList.remove('hidden');
                } else {
                    lightboxDate.classList.add('hidden');
                }

                // Manage navigation visibility/opacity based on positions
                if (currentIndex === 0) {
                    prevBtn.classList.add('opacity-10', 'pointer-events-none');
                } else {
                    prevBtn.classList.remove('opacity-10', 'pointer-events-none');
                }

                if (currentIndex === images.length - 1) {
                    nextBtn.classList.add('opacity-10', 'pointer-events-none');
                } else {
                    nextBtn.classList.remove('opacity-10', 'pointer-events-none');
                }

                // Fade back in when fully loaded
                lightboxImg.onload = () => {
                    lightboxImg.classList.remove('opacity-0');
                    lightboxInfo.classList.remove('opacity-0');
                };
            }, 150);
        };

        const showPrev = () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateLightboxContent();
            }
        };

        const showNext = () => {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateLightboxContent();
            }
        };

        // Click handlers for gallery cards
        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.getAttribute('data-index'));
                openLightbox(index);
            });
        });

        // Event listeners for UI controls
        closeBtn.addEventListener('click', closeLightbox);
        prevBtn.addEventListener('click', showPrev);
        nextBtn.addEventListener('click', showNext);

        // Click on background overlay to close
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Key listeners for accessible navigation
        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('pointer-events-none')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });
    });
</script>
{{ end }}
