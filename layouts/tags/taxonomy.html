{{ define "main" }}
<main class="max-w-7xl mx-auto px-6 pt-32 pb-24">
    
    <div class="mb-16 reveal">
        <h1 class="font-title text-5xl md:text-7xl font-bold text-lab-text mb-6">Topics & Tags</h1>
        <p class="text-xl text-lab-muted max-w-2xl leading-relaxed">Browse research projects and the people working on them by their tagged topics.</p>
    </div>

    <div class="flex flex-wrap gap-4 reveal">
        {{ range $term, $taxonomy := site.Taxonomies.tags }}
        <a href="{{ "/tags/" | relLangURL }}{{ $term | urlize }}/" class="group flex items-center gap-3 px-6 py-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md hover:border-lab-accent hover:-translate-y-1 transition-all duration-300">
            <div class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-50 group-hover:bg-lab-accent group-hover:text-white transition-colors text-lab-muted">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
            </div>
            <div>
                <h3 class="font-bold text-lab-text group-hover:text-lab-accent transition-colors capitalize text-lg">{{ $term }}</h3>
                <p class="text-xs text-lab-muted uppercase tracking-widest">{{ len $taxonomy.Pages }} Items</p>
            </div>
        </a>
        {{ end }}
    </div>

</main>
{{ end }}
