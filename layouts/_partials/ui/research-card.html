<a href="{{ .link }}" class="group cursor-pointer reveal flex flex-col w-[85vw] sm:w-[350px] md:w-[400px] snap-start shrink-0 block" {{ if .delay }}style="transition-delay: {{ .delay }}ms;"{{ end }}>
    <div class="relative overflow-hidden rounded-2xl aspect-[4/3] mb-6 bg-slate-100">
        <img src="{{ .img }}" loading="lazy" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
        <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-colors duration-500"></div>
    </div>
    <span class="text-xs font-bold text-lab-accent uppercase tracking-wider mb-2">{{ .tagline }}</span>
    <h3 class="font-title text-2xl font-bold mb-3 group-hover:text-lab-accent transition-colors">{{ .title }}</h3>
    <p class="text-sm text-lab-muted leading-relaxed line-clamp-3">
        {{ .desc }}
    </p>
</a>
