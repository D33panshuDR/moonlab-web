name: Weekly Update

on:
  schedule:
    # Runs at 00:00 on Sunday (UTC time)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-people:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv

      - name: Run Sync Script
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: python sync_people.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "MoonLab Bot"
          git config --global user.email "bot@moonlab.org"
          
          # Check if there are changes
          if [[ -n $(git status -s) ]]; then
            git add content/people/
            git commit -m "🤖 Auto-update team members from Google Sheet"
            git push
          else
            echo "No changes to commit."
          fi